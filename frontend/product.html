<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product – ToothKart</title>
  <script>document.documentElement.classList.add('js')</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#product">Skip to content</a>
  <header class="header">
    <div class="container header-row">
      <a class="logo" href="/"><b>Tooth<span>Kart</span></b><small>Trusted by clinics since 2016</small></a>
      <div class="grow"></div>
      <div class="actions">
        <a class="hbtn" href="/">← Continue shopping</a>
        <a class="hbtn" id="accountLink" href="/#signin">👤 Sign in</a>
        <a class="hbtn" href="/?open=cart">🛒 Cart <b id="cartCount">0</b></a>
      </div>
    </div>
  </header>

  <main id="product" class="container pd-main" aria-live="polite">
    <p class="empty" id="pdLoading">Loading product…</p>
  </main>

  <footer class="footer" id="siteFooter"></footer>
  <div class="toast" id="toast" role="status"></div>

  <script src="/site-content.js"></script>
  <script src="/product.js"></script>
  <script src="/effects.js"></script>
</body>
</html>
