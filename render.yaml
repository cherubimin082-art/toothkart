# Render "Blueprint": creates the ToothKart server with a disk that keeps the database and uploaded images.
# In Render: New + > Blueprint > pick this repository. Render asks for the values marked "sync: false".
# A persistent disk needs a paid instance (the "starter" plan below).
services:
  - type: web
    name: toothkart-cherubimin-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    disk:
      name: toothkart-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR            # the database and uploads live on the disk, so they survive restarts
        value: /var/data
      - key: TRUST_PROXY         # so each visitor gets their own rate limit instead of everyone sharing one
        value: "true"
      - key: JWT_SECRET          # generated for you; never share it
        generateValue: true
      - key: ADMIN_EMAIL         # the admin account is created from these two the first time the server starts
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMS_PROVIDER        # change to "2factor" and add TWOFACTOR_API_KEY in Render's Environment tab for real OTP texts
        value: console
      - key: SHOW_OTP_IN_RESPONSE
        value: "false"
